name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # Per-job path filters are not native to GitHub Actions, and a workflow-level
  # `paths:` on on.pull_request would stop the backend/frontend jobs from running
  # on docs-only PRs too. So docker-changes answers one question -- "does this PR
  # touch the images?" -- and the docker job acts on the answer.
  # ---------------------------------------------------------------------------

  docker-changes:
    name: Detect image-affecting changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Classify PR paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'frontend/Dockerfile'
              - 'pom.xml'
              - 'src/main/**'
              - 'src/main/resources/**'
              # The docker job's own definition. Without this, a PR that edits
              # only this file skips the job entirely -- so the smoke below
              # could never be fixed or verified in the PR that changes it.
              - '.github/workflows/maven.yml'
              # OPS-3: the alert path now runs inside this job, so the files it reads have to
              # bring the job with them. Without these two, a PR that broke a rule or renamed a
              # drill step would skip the job entirely and report success by omission -- the
              # shape of failure this whole workflow keeps rediscovering.
              - 'benchmark/observability/**'
              - 'docker/observability/grafana/provisioning/**'
              - 'docker/observability/alert-bridge/**'

      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "build=${{ steps.filter.outputs.docker }}" >> "$GITHUB_OUTPUT"
          else
            # master is the release line: always build there, whatever changed.
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # E7: JDK 21 is the runtime that ships. The image compiles on
      # maven:3.9-eclipse-temurin-21 (Dockerfile:7) and runs on
      # eclipse-temurin:21-jre (Dockerfile:17), so CI has to test on 21 or the
      # green checkmark describes a JVM nothing ever runs. The bytecode target is
      # unchanged and stays 18 (pom.xml <java.version>, which Spring Boot's parent
      # passes to the compiler) -- 21 is the VM, 18 is the contract. Local dev stays
      # free to be anything; the maintainer's JDK 18 still builds the same target.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B compile --file pom.xml

      - name: Run tests
        # -P is explicit now on purpose: the profile used to activate itself on any unix OS,
        # which made it invisible in the log and deniable in review. See pom.xml.
        run: mvn -B test --file pom.xml -P surefire-without-container-support

      # E4: on master, publish the objects a release can be pointed at. The
      # jar is not a by-product of `test`, so package explicitly; the name
      # comes from pom finalName (pom.xml:169), not from artifactId/version.
      - name: Package jar
        if: github.event_name == 'push'
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload jar artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-campus-jar
          path: target/nexus-campus.jar
          if-no-files-found: error

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # R3's test step needs this. jsdom 30 declares
          # `^22.22.2 || ^24.15.0 || >=26.0.0` and its undici calls
          # `webidl.util.markAsUncloneable`, which Node 20 does not have: on "20" every
          # test file died at collection with 6 errors and "no tests", which is the
          # loudest possible version of a suite that silently runs nothing.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Round six: the job used to be lint and tsc only, which is a guarantee
      # that the code compiles, not that it works. 310 backend tests were green
      # beside 0 frontend ones; that ratio is the reason this step exists.
      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # E4: same idea as the jar -- on master the built SPA is kept as an
      # artifact, not left inside the runner's /tmp.
      - name: Upload frontend dist
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  # Nothing else in this workflow touches the alert bridge: not its tests, not its image. That is
  # not a hypothetical gap. On 2026-09-17 the bridge dropped every notification whose value was not
  # zero, and its 17 unit tests were green throughout -- because the fixture carried a payload shape
  # Grafana does not send, and nothing ran them on a pull request to say otherwise. The tests are
  # seconds; the image is one COPY onto alpine. See
  # docs/research/alert-bridge-values-shape-2026-09.md.
  alert-bridge:
    name: Alert bridge tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker/observability/alert-bridge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `main` refuses to start without a webhook, so the tests import the module with an empty
      # environment on purpose; nothing here needs a secret or a network.
      - name: Unit tests
        run: python -m unittest test_alert_bridge

      # The Dockerfile is a COPY onto python:3.12-alpine. Cheap to build, and otherwise nothing
      # would notice a broken one until someone tried to start the monitoring profile.
      - name: Build the bridge image
        run: docker build -t nexus-alert-bridge:ci .

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-changes]
    # E7: this used to be push-to-master-only, so no PR ever built the images --
    # the last change to Dockerfile's HEALTHCHECK merged with zero CI coverage
    # on the thing that actually ships. Now any PR touching the image inputs
    # gets a build, and master additionally gets the run smoke below.
    # The explicit success checks matter: a custom if on a job with needs replaces
    # the default "all dependencies succeeded" gate, so it has to be restated or a
    # red backend would still build images.
    if: >-
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.docker-changes.result == 'success' &&
      needs.docker-changes.outputs.build == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Image names match what docker-compose.yml builds and runs
      # (nexus-vibe-app / nexus-vibe-web); CI stamps them with the commit SHA
      # where the host stamps them with APP_TAG. Same artifact, different id.
      # `load` only matters for the smoke step below, and it costs nothing
      # elsewhere.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: nexus-vibe-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          tags: nexus-vibe-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This step used to be `if: github.event_name == 'push'`, on the argument
      # that booting MySQL + Spring on every PR is a cost nobody asked for. The
      # argument was wrong, and here is the evidence: the JWT secret below was
      # committed as a redaction-styled placeholder, so the app could not start,
      # so this step failed on every master push -- and nobody saw it for four
      # merges, because PRs were green by construction and master was already red
      # before anyone looked. A gate that only runs after the merge is an alarm.
      #
      # It now runs wherever the docker job runs: any PR that touches the image
      # inputs (that is the `docker-changes` filter above) and every master push.
      # It is still only three containers, no registry, no secrets.
      #
      # The DB is the only fatal dependency: DOWN maps to 503 and must kill this
      # step. Redis is present so the happy path is exercised; Elasticsearch and
      # Ollama are deliberately absent, and ADR-0007 says their outage reports as
      # DEGRADED -> HTTP 200, so this step doubles as proof that the degraded-but-serving
      # semantics survive into the packaged image instead of only in tests.
      - name: Smoke-run backend image
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e MYSQL_ROOT_PASSWORD=smoke-root-pw-not-a-secret \
            -e MYSQL_DATABASE=nexus_campus \
            -e TZ=Asia/Shanghai \
            -v "$PWD/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro" \
            mysql:8.0
          docker run -d --name smoke-redis --network smoke redis:7-alpine
          # JWT_SECRET must be standard base64 decoding to >= 32 bytes:
          # JwtUtil.init() base64-decodes it and hands the bytes to
          # Keys.hmacShaKeyFor(). The literal `ci-...0000` that used to sit below
          # contains '-' (0x2d), which is not in the base64 alphabet, so the
          # context died at startup and this step never passed once. The value
          # below decodes to 'nexus-vibe-ci-smoke-secret-do-not-use' (37 bytes).
          docker run -d --name smoke-app --network smoke -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL='jdbc:mysql://smoke-db:3306/nexus_campus?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=smoke-root-pw-not-a-secret \
            -e REDIS_HOST=smoke-redis \
            -e REDIS_PORT=6379 \
            -e JWT_SECRET='bmV4dXMtdmliZS1jaS1zbW9rZS1zZWNyZXQtZG8tbm90LXVzZQ==' \
            nexus-vibe-app:${{ github.sha }}
          ok=0
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Status}}' smoke-app)
            if [ "$state" != "running" ]; then
              echo "container left the running state: $state"
              break
            fi
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "smoke: /actuator/health answered 200 on attempt $i"
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::shipped image failed the /actuator/health smoke"
            docker logs --tail 200 smoke-app || true
            docker logs --tail 100 smoke-db || true
            exit 1
          fi
          curl -fsS http://localhost:8080/actuator/health

      # OPS-3. The drill runs by hand on a developer machine; these are the steps from it that are
      # cheap and deterministic enough to run here, and the middle one is the assertion no unit
      # test can make: it reads the app's own metrics endpoint back and checks that every metric
      # the alert expressions select on exists in *this* build. That is the check that caught
      # `post.created` publishing as `post_total`; four green unit tests could not see it, because
      # SimpleMeterRegistry keeps meter names verbatim.
      #
      # Same script, same step bodies: -Only selects a subset and marks the rest SKIP, so the
      # assertions are not restated here where they would drift. `stack-up` is deliberately not
      # selected, which is what stops the drill from building or bringing anything up itself --
      # and the three containers below are all the selected steps need.
      #
      # `rate-limit-rejects-and-counts` is in the list as a precondition rather than a bonus.
      # rate_limit_rejected_total has no series until something is actually rejected, so on a fresh
      # app the live-scrape step fails without it. Measured 2026-09-17, which is also how the
      # precondition got written down instead of remembered.
      - name: Run the drill's alert steps
        run: |
          set -euo pipefail

          # app declares `env_file: .env`, and .env is not in git. Building one from the shipped
          # example doubles as a check that the example is still a working configuration.
          cp .env.example .env
          sed -i "s|^APP_TAG=.*|APP_TAG=${GITHUB_SHA}|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=ci-drill-pw-not-a-secret|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=bmV4dXMtdmliZS1jaS1zbW9rZS1zZWNyZXQtZG8tbm90LXVzZQ==|" .env
          sed -i "s|^BOOTSTRAP_ADMIN_PASSWORD=.*|BOOTSTRAP_ADMIN_PASSWORD=ci-drill-admin-not-a-secret|" .env
          export APP_TAG="${GITHUB_SHA}"
          export WEB_PORT=18080

          compose() {
            docker compose -p nexus-drill \
              -f docker-compose.yml -f benchmark/observability/docker-compose.drill.yml \
              --profile monitoring --profile drill "$@"
          }
          # Clean up on failure too. A leftover nexus-drill-* container makes the next run of this
          # job refuse to start, which presents as a flaky gate rather than as the leak it is.
          trap 'compose down -v || true' EXIT

          # --no-deps skips the app's declared Elasticsearch and Ollama dependencies on purpose:
          # ADR-0007 makes their absence DEGRADED rather than fatal, which is the same reason the
          # smoke above runs on MySQL and Redis alone.
          compose up -d --no-deps db redis app

          ok=0
          for i in $(seq 1 60); do
            if docker exec nexus-drill-app curl -fsS -o /dev/null http://localhost:8080/actuator/health; then
              echo "drill app answered /actuator/health on attempt $i"
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::the drill app never answered /actuator/health"
            docker logs --tail 200 nexus-drill-app || true
            exit 1
          fi

          pwsh -NoProfile -File benchmark/observability/drill.ps1 -SkipBuild \
            -Only rate-limit-rejects-and-counts,alert-no-data-policy-is-per-rule,alert-rules-select-real-metrics
