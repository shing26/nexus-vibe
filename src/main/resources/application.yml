server:
  port: 8081
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

spring:
  application:
    name: nexus-vibe
  task:
    execution:
      pool:
        core-size: 4
        max-size: 10
        queue-capacity: 100
    thread-name-prefix: nexus-async-

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  # H2 Database (dev mode - switch to MySQL for production)
  datasource:
    url: jdbc:h2:mem:nexuscampus;DB_CLOSE_DELAY=-1;MODE=MYSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # Redis Configuration (Boot 3.x namespace)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000
      connect-timeout: 2000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cache:
    type: simple
    redis:
      time-to-live: 1h
      cache-null-values: false

  # File upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.nexus.campus.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT Configuration
# Dev-only fallback; production requires JWT_SECRET to be set explicitly.
jwt:
  secret: ${JWT_SECRET:OExHRjA3QjlGRjI0NUI0Q0E1RTdDRjI2MDA3QTUxMjhDOTdBNkY4RjI0NUI0Q0E1RTdDRjI2MDdCOTg2RjA3Qg==}
  expiration: 86400000

# DFA Sensitive Words
campus:
  # Dev default keeps Redis off so the app runs without external services.
  # Enable via REDIS_ENABLED=true in production (see application-prod.yml).
  redis:
    enabled: false
  cache:
    ttl: 1h
  demo:
    password: ${DEMO_PASSWORD:123456}
  upload:
    dir: src/main/resources/static/uploads
  es:
    uri: ${ES_URI:http://localhost:9200}
  security:
    sensitive-words: fuck,shit,damn,asshole,bitch
    critical-words: 赌博,毒品,色情,诈骗,暴力,枪支,恐怖主义,违禁品
    audit-required-level: 2

  ai:
    review:
      enabled: true
    safety:
      enabled: true
    llm:
      endpoint: ${LLM_ENDPOINT:http://localhost:11434/v1}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:qwen2.5:7b}
      timeout: ${LLM_TIMEOUT:30s}

# Logging
logging:
  level:
    com.nexus.campus: DEBUG
    org.springframework: INFO
    org.mybatis: INFO

---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: jdbc:mysql://localhost:3306/nexus_campus?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    h2:
      console:
        enabled: false
    sql:
      init:
        mode: never

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
