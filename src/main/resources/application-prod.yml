server:
  port: ${SERVER_PORT:8080}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nexus_campus?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000
      connect-timeout: 2000
  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
  cache:
    type: redis
    redis:
      time-to-live: 1h
      cache-null-values: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

campus:
  redis:
    enabled: ${REDIS_ENABLED:true}
  cache:
    ttl: ${CACHE_TTL:1h}
  # Required only when demo seeding is enabled: DataPreloader fails fast if DEMO_PASSWORD is blank.
  demo:
    password: ${DEMO_PASSWORD:}
    # Demo accounts are opt-in for production; set DEMO_SEED_ENABLED=true for a public demo.
    seed-enabled: ${DEMO_SEED_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://nexus-vibe.shing26.is-a.dev}
  upload:
    dir: ${UPLOAD_DIR:/app/uploads}
  es:
    uri: ${ES_URI:http://localhost:9200}
  ai:
    review:
      enabled: ${AI_REVIEW_ENABLED:true}
    llm:
      endpoint: ${LLM_ENDPOINT:https://api.openai.com/v1}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:gpt-4o}
      timeout: ${LLM_TIMEOUT:30s}

logging:
  level:
    com.nexus.campus: INFO
    org.springframework: WARN
    org.mybatis: WARN

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
