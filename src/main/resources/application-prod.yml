server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nexus_campus?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000
      connect-timeout: 2000
  cache:
    type: redis
    redis:
      time-to-live: 1h
      cache-null-values: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

campus:
  redis:
    enabled: ${REDIS_ENABLED:true}
  cache:
    ttl: ${CACHE_TTL:1h}
  # Required at startup: DataPreloader fails fast when DEMO_PASSWORD is blank.
  demo:
    password: ${DEMO_PASSWORD:}
  upload:
    dir: ${UPLOAD_DIR:/app/uploads}
  es:
    uri: ${ES_URI:http://localhost:9200}
  ai:
    review:
      enabled: ${AI_REVIEW_ENABLED:true}
    llm:
      endpoint: ${LLM_ENDPOINT:https://api.openai.com/v1}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:gpt-4o}
      timeout: ${LLM_TIMEOUT:30s}

logging:
  level:
    com.nexus.campus: INFO
    org.springframework: WARN
    org.mybatis: WARN

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
