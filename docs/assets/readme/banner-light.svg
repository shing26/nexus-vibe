<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 190" width="1280" height="190" role="img" aria-labelledby="bannerLightTitle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title id="bannerLightTitle">The resilience chain: a post is lease-claimed, reviewed by the LLM, and its output repaired and validated; an unreachable model sends posts to a fail-closed queue that reconciliation restores.</title>
  <defs>
    <radialGradient id="glowLA" cx="12%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLB" cx="88%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect width="1280" height="190" fill="#ffffff"/>
  <rect width="1280" height="190" fill="url(#glowLA)"/>
  <rect width="1280" height="190" fill="url(#glowLB)"/>
  <line x1="0" y1="189.5" x2="1280" y2="189.5" stroke="#d0d7de" stroke-width="1"/>

  <text x="56" y="66" font-size="11" font-weight="700" letter-spacing="2.4" fill="#656d76">THE RESILIENCE CHAIN</text>
  <text x="56" y="90" font-size="11.5" fill="#8c959f">what the pipeline does when</text>
  <text x="56" y="107" font-size="11.5" fill="#8c959f">the model is the unreliable part</text>

  <line x1="300" y1="42" x2="300" y2="150" stroke="#d8dee4" stroke-width="1"/>

  <rect x="336" y="56" width="190" height="56" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="431" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Post</text>
  <text x="431" y="100" text-anchor="middle" font-size="11" fill="#656d76">code block detected</text>

  <line x1="534" y1="84" x2="558" y2="84" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrowL)"/>

  <rect x="568" y="56" width="190" height="56" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="663" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Lease claim</text>
  <text x="663" y="100" text-anchor="middle" font-size="11" fill="#656d76">owner + expiry + budget</text>

  <line x1="766" y1="84" x2="790" y2="84" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrowL)"/>

  <rect x="800" y="56" width="190" height="56" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text x="895" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">LLM review</text>
  <text x="895" y="100" text-anchor="middle" font-size="11" fill="#656d76">the unreliable dependency</text>

  <line x1="998" y1="84" x2="1022" y2="84" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrowL)"/>

  <rect x="1032" y="56" width="190" height="56" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="1127" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Repair + validate</text>
  <text x="1127" y="100" text-anchor="middle" font-size="11" fill="#656d76">&#8804; 2 calls, then record</text>

  <line x1="895" y1="112" x2="895" y2="136" stroke="#d4a72c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="745" y="138" width="430" height="30" rx="15" fill="#fff8c5" stroke="#d4a72c" stroke-opacity="0.55" stroke-width="1"/>
  <text x="960" y="157" text-anchor="middle" font-size="12" fill="#9a6700">unreachable &#8594; audit queue &#8594; reconcile &#8594; restored</text>
</svg>
