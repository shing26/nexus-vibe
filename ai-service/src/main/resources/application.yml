server:
  port: 8000

spring:
  application:
    name: nexus-ai-service
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

ai-service:
  llm:
    # Provider root: Spring AI appends /v1/chat/completions. AI_LLM_ENDPOINT
    # overrides; otherwise reuse the direct path's LLM_ENDPOINT and normalize
    # away its trailing /v1.
    base-url: ${AI_LLM_ENDPOINT:${LLM_ENDPOINT:http://localhost:11434/v1}}
    api-key: ${LLM_API_KEY:ollama}
    model: ${LLM_MODEL:qwen2.5:3b}
    # Deliberately independent of LLM_TIMEOUT: the direct path may need 180s,
    # but three such attempts cannot fit inside the application's read deadline.
    timeout: ${AI_LLM_TIMEOUT:30s}
    max-attempts: ${AI_LLM_MAX_ATTEMPTS:3}
    retry-backoff-ms: ${AI_LLM_RETRY_BACKOFF_MS:500}
    health-cache-seconds: ${AI_HEALTH_CACHE_SECONDS:60}
    # Restores the direct path's provider-enforced output. json_object is the fallback
    # for providers without native schema support; none keeps the prompt-only behaviour.
    response-format: ${AI_LLM_RESPONSE_FORMAT:json_schema}
    breaker-failures: ${AI_LLM_BREAKER_FAILURES:5}
    breaker-open-seconds: ${AI_LLM_BREAKER_OPEN_SECONDS:30}
    # A probe that never reports back (Error, killed thread) is reclaimed after this.
    breaker-probe-seconds: ${AI_LLM_BREAKER_PROBE_SECONDS:35}
    # Opt-in JSONL archive of every provider attempt. Blank = off; the operator owns
    # rotation and a container without a writable mount must still start.
    archive: ${AI_CALL_ARCHIVE:}
  service:
    api-key: ${AI_SERVICE_KEY:}
    max-context-tokens: ${AI_MAX_CONTEXT_TOKENS:12000}
  review:
    # Content-addressed dedup: in-flight coalescing plus a bounded valid-result cache.
    cache-ttl: ${AI_REVIEW_CACHE_TTL:10m}
    cache-max-entries: ${AI_REVIEW_CACHE_MAX_ENTRIES:500}

logging:
  level:
    com.nexus.campus.ai: INFO
    org.springframework.ai: INFO
