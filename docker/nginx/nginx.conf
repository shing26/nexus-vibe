# =============================================================================
# Nexus-Vibe - Nginx Site Config (used by the frontend Docker image)
# Serves the built React SPA and proxies /api to the Spring Boot app.
#
# The app is addressed by a variable resolved at request time rather than by an
# upstream block. `upstream { server app:8080; }` is resolved when the config is
# loaded, so on a cold `docker compose up` nginx exited with "host not found in
# upstream" whenever the app container had not been created yet, and only the
# restart policy saved it. That is a self-healing crash loop standing in for a
# startup order, and it takes the static site down with it.
#
# What this costs: OSS nginx cannot keep `keepalive` connections to a backend it
# resolves per request, so every proxied call now opens its own connection to the
# app. It bought the keepalive the config-load race; Tomcat accepts a fresh
# connection per request as ordinary traffic, and the alternative - Plus-only
# `resolve` inside an upstream block - is not available in this image.
# =============================================================================

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# 127.0.0.11 is Docker's embedded resolver. valid=10s means a recreated app
# container is picked up on the next request after ten seconds, rather than
# never, which is what the config-load-time resolution gave us.

map $http_cf_connecting_ip $real_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen       80;
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    add_header X-Frame-Options          "SAMEORIGIN"   always;
    add_header X-Content-Type-Options   "nosniff"      always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Long-cache built assets (hashed filenames)
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API proxy
    location /api/ {
        set $nexus_app app:8080;
        # No URI part: with a variable in proxy_pass nginx forwards the request URI
        # unchanged, which is what the upstream form did, so /api/v1/... still lands
        # on the app as /api/v1/...
        proxy_pass http://$nexus_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $real_client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";
        # A public visitor must not choose the identifier this deployment logs and
        # quotes back at them. Clearing it here is what makes the app's own
        # "do not trust inbound X-Trace-Id" default redundant rather than hopeful.
        proxy_set_header X-Trace-Id        "";
        proxy_buffering off;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate";
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Health check, public side.
    #
    # The URL stays /actuator/health for anything already watching it (Cloudflare uptime), but the
    # upstream is the `servable` group rather than the aggregate. Same status code, two different
    # questions: the container healthcheck (Dockerfile:38) asks the aggregate "should this container
    # be replaced", an outside probe may only answer "can users still use the site". Wiring both to
    # one document meant a full LLM outage reported all-clear externally with no operator looking at
    # the difference. Dependency detail is /actuator/health/deps, which stays closed at the edge and
    # is what the alerting layer reads. See ADR-0007.
    location = /actuator/health {
        set $nexus_app app:8080;
        # A variable proxy_pass cannot carry a path, so the rewrite does the path
        # part: the public URL stays /actuator/health while the app is asked the
        # narrower servable question. See ADR-0007.
        rewrite ^ /actuator/health/servable break;
        proxy_pass http://$nexus_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $real_client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Trace-Id        "";
        access_log off;
    }

    # Everything else under /actuator/ stays inside the compose network.
    #
    # The exact-match block above is the only actuator path nginx forwards, so /actuator/metrics,
    # /actuator/env and the new /actuator/health/deps group already fell through to the SPA
    # fallback and returned index.html with a 200. That looked safe and was only accidental: one
    # edit to the fallback would have made it a real exposure. An explicit 404 is the statement.
    location /actuator/ {
        return 404;
    }

    location ^~ /uploads/ {
        set $nexus_app app:8080;
        proxy_pass http://$nexus_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $real_client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
