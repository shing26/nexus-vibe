# Prometheus scrape config for the Nexus-Vibe monitoring profile.
#
# It scrapes the app over the compose network only. Nothing here is reachable from outside:
# the prometheus service maps no host port either, so browsing it needs
# `docker compose exec` or a temporary port publish during the drill.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: nexus-vibe

scrape_configs:
  # Spring Boot actuator endpoint exposed by the prod profile
  # (management.endpoints.web.exposure.include: health,info,prometheus).
  - job_name: nexus-vibe
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Grafana exposes its own metrics, which makes the alerting layer observable by the same stack
  # that depends on it. Without this target a dead Grafana takes all six rules with it and the only
  # symptom is silence -- the one failure the monitoring cannot report, because the thing that
  # would report it is what died. This target exists so that blackout becomes a firing rule.
  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana
