# Grafana unified-alerting rules for the Nexus-Vibe pipeline.
#
# Provisioned, not hand-built in the UI, so a rebuilt box cannot quietly lose the alerts. Each rule
# keeps the same expression as its dashboard panel; the comments record the failure it is meant to
# catch and the traffic it assumes, because an alert nobody remembers how to read gets muted.
#
# Missing data is not one answer for six rules, so each one decides for itself:
#   - The gauge rules (breaker, backlog) and the scrapability rule watch series that exist from the
#     moment the app registers them. No data there means the watched thing is gone: Alerting.
#   - The ratio rules (5xx, burn-rate, rate-limit) end in a volume guard, so an empty result
#     normally means "too quiet to have a rate", which is not an outage. Those stay OK, and the one
#     honest no-data-there-is-a-problem question -- can Prometheus scrape the app at all -- has its
#     own rule near the bottom of this file. That is the only reason OK is defensible on a ratio.
#   - execErrState (the evaluation itself failed, usually: Grafana cannot reach Prometheus) is
#     Alerting on the scrapability rule alone. The other five report OK on purpose, so a Prometheus
#     restart is one alert about blindness rather than six. Without that single rule the old failure
#     mode -- the whole stack reporting healthy while nothing is being measured -- comes straight
#     back. These are the only two state knobs the provisioning schema has; a third key here was
#     silently dropped, and it is gone.
#
# Spelling is load-bearing: noDataState and execErrState take exactly Alerting | NoData | OK |
# KeepState. A provisioned file Grafana cannot parse aborts startup, so with restart: unless-stopped
# the whole monitoring profile crash loops -- which is loud, but only if someone is watching
# docker compose ps. benchmark/observability/drill.ps1 has a step for it, and so does
# GrafanaAlertProvisioningTest, which is the two-second version of the same lesson.
apiVersion: 1

groups:
  - orgId: 1
    name: nexus-vibe
    folder: Nexus Vibe
    interval: 1m
    rules:
      # The LLM being unreachable is normal operation for this app: posts park in pending-llm and
      # the reconcile task retries. What must not pass unnoticed is a breaker that stays open,
      # because after lease-seconds x max-attempts the reviews start failing for good.
      #
      # Threshold is not traffic-dependent -- the gauge is 0 or 1 and gt 0.5 means "open at any
      # point in the last 5m" -- but the rule does assume someone is posting. Overnight, a breaker
      # that opened at 23:50 on the last post of the day decays back to 0 only when a new attempt
      # succeeds, so the gauge can hold a stale value until the morning traffic exercises it. The
      # number to collect before touching this rule is the hourly post-arrival rate; without it,
      # "5m of open breaker" silently means "5m of open breaker *and* someone tried to post".
      - uid: nexus-llm-breaker-open
        title: "LLM circuit breaker has been open for 5m"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: nexus-prometheus
            model:
              refId: A
              expr: 'max_over_time(llm_circuit_breaker_open{application="nexus-vibe"}[5m])'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0.5] }
        for: 5m
        # Registered in the LlmClient constructor, so it is in every scrape while the process is
        # up. Absent series therefore mean the process, the endpoint, or the scrape is gone, and
        # "we cannot see the breaker" is not the same fact as "the breaker is closed".
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: critical
          service: nexus-vibe
        annotations:
          summary: "The breaker is open, so every AI review is failing fast."
          description: "Check LLM_ENDPOINT reachability and /actuator/health llm detail; the reconcile task retries once the probe answers."

      # Backlog is the leading indicator: it grows while users keep posting and the pipeline keeps
      # declining the work. 15m of waiting avoids firing on a single in-flight batch.
      #
      # Threshold 10 is the only number in this file with a measurement behind it: the local 7B CPU
      # run in docs/research/async-pool-loadtest.md cleared about 2-3 posts/min, so 10 parked
      # reviews is roughly 4 minutes of arrivals at full pipeline speed and 15 minutes of it means
      # the drain rate has collapsed rather than a batch being in flight. Assumed traffic: a day
      # where people are posting. At night one burst of 11 posts with the LLM down will fire this
      # rule on an empty campus, which is accepted -- the work is genuinely still owed, just not
      # owed loudly. Re-derive from ai_review_pending_posts over the first real week plus the
      # observed posts/min on the reconcile log lines.
      - uid: nexus-ai-review-backlog
        title: "AI review backlog above 10 for 15m"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: nexus-prometheus
            model:
              refId: A
              expr: 'max_over_time(ai_review_pending_posts{application="nexus-vibe"}[15m])'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [10] }
        for: 15m
        # The gauge is registered in the reconcile task's @PostConstruct, before the first cron
        # tick, and it is refreshed ahead of that task's health gate -- so it reads 0 on an idle
        # app rather than nothing. No data means the app or the scrape is down, which is the
        # incident this rule's own annotation points at ("if the breaker gauge is 0 too, the cron
        # is not running").
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          service: nexus-vibe
        annotations:
          summary: "Posts are waiting on an AI review verdict that is not arriving."
          description: "If the breaker gauge is 0 too, the reconcile cron is not running or is throwing."

      # 5xx is the only rule that speaks for the whole API surface. The denominator is deliberately
      # unfiltered: a ratio against "non-health requests" would drift whenever a uri tag changes.
      #
      # Threshold 1% is an estimate, not a measurement, and it assumes a day where the API answers
      # more than a handful of requests a minute. The volume guard at the end of the expression is
      # what stops that estimate from firing on arithmetic: below 0.05 rps (3 requests/minute) a
      # single 500 is already over 1%, and one lonely 500 in a quiet minute is a ratio, not an
      # incident. The only measured rate in this repository is a load test that offered 700+
      # requests/second at the entry (docs/research/async-pool-loadtest.md), which is a saturation
      # number and not a forecast. What should replace both guesses: p50/p95 of
      # sum(rate(http_server_requests_seconds_count{application="nexus-vibe"}[5m])) by hour of day
      # over the first real week, read against the count of level=ERROR lines in
      # /app/logs/nexus-vibe.json for the same hours.
      #
      # 1% is also the floor the burn-rate rule near the end of this file deliberately does not
      # carry: at real traffic a 1.44% error rate is a burning budget, while at quiet traffic a 1%
      # floor is what is left reading. Which is why nexus-ai-review-backlog above treats a zero as a
      # normal answer, why this rule keeps a floor, and what nexus-prometheus-scrape-failed is for.
      - uid: nexus-http-5xx-ratio
        title: "HTTP 5xx ratio above 1% for 5m"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: nexus-prometheus
            model:
              refId: A
              expr: 'sum(rate(http_server_requests_seconds_count{application="nexus-vibe",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{application="nexus-vibe"}[5m])) and sum(rate(http_server_requests_seconds_count{application="nexus-vibe"}[5m])) > 0.05'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0.01] }
        for: 5m
        # An empty result here is the guard talking, and the guard is honest: it means "not enough
        # requests in this window for a percentage to mean anything", which describes a quiet campus
        # at 3am rather than a broken site. So OK. The case that used to hide behind this state -
        # nobody is being scraped at all - is what nexus-prometheus-scrape-failed now owns, and this
        # answer is only safe because that rule exists.
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          service: nexus-vibe
        annotations:
          summary: "More than 1% of requests are failing server-side."
          description: "Grep the JSON logs for traceId values on level ERROR; the response header X-Trace-Id points at the same line."

      # Rejections are the cheap signal for a credential-stuffing run or a client bug in a loop.
      # The volume guard keeps a single stray 429 from firing a "3x baseline" ratio off a zero base,
      # and this is the least ambiguous no-data answer in the file - see the state comment below.
      - uid: nexus-rate-limit-spike
        title: "Rate-limit rejections spiking above 3x baseline"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: nexus-prometheus
            model:
              refId: A
              expr: 'sum(rate(rate_limit_rejected_total{application="nexus-vibe"}[5m])) / clamp_min(sum(rate(rate_limit_rejected_total{application="nexus-vibe"}[1h] offset 1h)), 0.01) and sum(increase(rate_limit_rejected_total{application="nexus-vibe"}[5m])) > 10'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [3] }
        for: 5m
        # No rejections is the healthy state, and it looks identical to no traffic. The severity is
        # warning, and rate_limit_rejected_total is created lazily at the first rejection
        # (RateLimitInterceptor:121), so no data is the expected answer on any box that has never
        # shed a request. ALERTING here would raise a fuss about the absence of bad traffic, which
        # is the one thing this rule is supposed to mean by "quiet".
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          service: nexus-vibe
        annotations:
          summary: "One path is being rejected far more often than its own hour baseline."
          description: "The path tag names the endpoint; the [RATE-LIMIT] log lines name the client IP."

      # The rule that watches the watchers, and the reason the rules above are allowed to say what
      # they say about no data. `up` is the series Prometheus writes about its own scraping, so it
      # survives every failure the app's metrics cannot report: the process gone, the endpoint no
      # longer exposed, the target list empty, Prometheus restarted without this job. min_over_time
      # rather than the bare value, so that one dropped scrape does not read as an outage - the
      # interval is 15s, and a container restart routinely costs more than one of those.
      - uid: nexus-prometheus-scrape-failed
        title: "Prometheus has not been able to scrape the app for 2m"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: nexus-prometheus
            model:
              refId: A
              expr: 'min_over_time(up{job="nexus-vibe"}[2m])'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: lt, params: [0.5] }
        for: 1m
        # `job=`, never `application=`: Prometheus synthesizes up, and it cannot carry the common tag
        # of a process that is not answering. The value is a contract with the job_name at
        # docker/observability/prometheus/prometheus.yml:16, and benchmark/observability/drill.ps1
        # checks it against the live target list, because a renamed job kills this rule in silence.
        #
        # Absent data, a query error and an execution error are all ALERTING here. The series is
        # missing only when the job is gone, and Grafana gets no answer only when Prometheus is down
        # - neither of which is a state worth reporting as healthy. This is the one rule where the
        # monitoring stack has to admit it is blind.
        #
        # What it is actually worth in time: 15s scrapes put a zero in the 2m window within ~2m of
        # the process dying, then for: 1m on a 1m group cadence - a 3-4 minute page for "the site is
        # gone and I would otherwise have learned that from a user". The same window is the recovery
        # lag: this stays firing for up to 2m after the target comes back, because min_over_time is
        # still looking at the zeros.
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: nexus-vibe
        annotations:
          summary: "Monitoring cannot see the app: every scrape in the last 2m failed."
          description: "docker compose ps, then docker compose logs app; if the container is Up, GET /actuator/prometheus from inside nexus-net - a 404 there means the exposure list changed, not that the app died."

      # The SLO this file has been implying without saying it, written down at last: 99.9% of
      # requests served without a 5xx, over a rolling 30d window. That budget is 43.2 minutes of bad
      # requests a month, and a 14.4x burn spends 2% of it in an hour - the rate a page has to be
      # worth. Threshold and guard shape come from docs/tickets/evidence-credibility.md E3.
      #
      # Relationship to nexus-http-5xx-ratio, stated plainly because two rules on one measurement
      # looks like an accident: same 5m window, higher ratio, shorter pending. This one wins by
      # roughly three minutes during a real outage and says why in budget terms; the 1% rule still
      # catches the slow bleed this one is not sensitive enough to see. If the overlap ever stops
      # paying for itself, this is the rule to retire, not the 1% one.
      #
      # Both floors are load-bearing and both assume traffic that has never been measured: 0.05 rps
      # is 3 requests a minute, 0.01 rps is 3 server errors in the window. A 1.44% ratio cannot be
      # reached below ~70 requests per 5m at all, so at low volume it is the error floor that decides
      # whether this rule is allowed an opinion. The series that would calibrate the pair is p50/p95
      # of the request rate by hour of day over a real week - see nexus-http-5xx-ratio above.
      - uid: nexus-availability-999-fast-burn
        title: "Availability error budget burning at 14.4x of the 99.9% SLO"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: nexus-prometheus
            model:
              refId: A
              expr: 'sum(rate(http_server_requests_seconds_count{application="nexus-vibe",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{application="nexus-vibe"}[5m])) and sum(rate(http_server_requests_seconds_count{application="nexus-vibe"}[5m])) > 0.05 and sum(rate(http_server_requests_seconds_count{application="nexus-vibe",status=~"5.."}[5m])) > 0.01'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0.0144] }
        for: 2m
        # Ratio rules answer nothing when they have no samples, and here that is the two guards
        # being honest rather than a cover-up: too quiet for a rate, or too few 5xx for a burn. The
        # failure that used to hide in this state - the app not being scraped at all - now has its
        # own critical, so OK here is a decision and not the default.
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          service: nexus-vibe
        annotations:
          summary: "99.9% availability is burning at 14.4x: 2% of the month's budget per hour."
          description: "Same triage as the 5xx rule. This one cannot fire on fewer than about 3 server errors inside the window, so the errors are real and findable by traceId."

      # The rule that would have caught the bug fixed in ADR-0014. That defect made the agent pool's
      # saturation rejection unreachable, so a post stayed ACTIVE with no safety verdict and no
      # marker for reconciliation to find -- while the breaker read 0, the review backlog read 0, the
      # 5xx ratio read 0 and every container was healthy. Nothing in the stack was watching the one
      # thing the stack exists to do, because nothing counted it.
      #
      # Both series are registered in PostAgentEventPublisher's constructor, so "no rejection" is a
      # measured 0 and absent data is a fault rather than an untested box. Threshold is therefore
      # the smallest useful one: a single rejection in 15 minutes is worth a look, because the pool
      # is 2 core / 4 max / 50 queue and the whole fail-closed design exists for that ceiling.
      - uid: nexus-agent-pool-rejected
        title: "Agent pool has been rejecting events for 15m"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: nexus-prometheus
            model:
              refId: A
              # Every arm is wrapped in max() so the result carries no labels, and `or` unions only
              # distinct label sets -- which is what keeps this one series rather than two. Without
              # that, the reduce/last stage would pick between a labelled counter and a labelled
              # `up` at random once the counter starts existing.
              #
              # Two counters, not one: the producer is in the metric name (review / safety) rather
              # than in a tag, so both have to be summed. Naming only one would silently watch half
              # the pipeline -- and `agent_pool_rejected_total` is not a series that exists at all.
              #
              # The `or max(up * 0)` tail is what separates "the pipeline is rejecting work" from
              # "this build does not publish the counter yet". Without it the two collapse into one
              # empty result and noDataState: Alerting pages for the second one -- which is exactly
              # what happened the moment these rules were provisioned ahead of the app that emits
              # the series. Note what this does and does not cover: a failed scrape sets `up` to 0
              # rather than removing it, so app death is NOT what this rule catches -- that is
              # nexus-prometheus-scrape-failed's job, and having both try would be two pages for one
              # event. The only way this expression goes empty is the nexus-vibe job vanishing from
              # prometheus.yml, which is a config fault no other rule would see.
              expr: 'max(increase(agent_pool_rejected_review_total{application="nexus-vibe"}[15m])) or max(increase(agent_pool_rejected_safety_total{application="nexus-vibe"}[15m])) or max(up{job="nexus-vibe"} * 0)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0] }
        for: 1m
        # Registered eagerly, so absence means the process, the endpoint or the scrape is gone --
        # the same reasoning as the breaker rule above, and the reason this one is not OK-on-no-data
        # like the ratio rules.
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          service: nexus-vibe
        annotations:
          summary: "The agent pool is refusing work; posts are being held or retried instead of reviewed."
          description: "The saturation log lines name the post. Raising core/max/queue moves the ceiling; the fix for a ceiling that is too low is a bigger pool, not a louder alert."

      # The safety backlog is the moderation queue, and it is the state ADR-0004 exists to produce.
      # Until this gauge existed the review side had a number and the safety side had none, which is
      # backwards: posts parked here are posts nobody has cleared, and a moderation queue that
      # nobody watches is indistinguishable from a moderation queue that is empty.
      #
      # Threshold is 0, sustained 15m, and that is deliberate rather than lazy. A post in this state
      # is invisible to users by design, so one that lingers is a moderation decision nobody made.
      # The baseline on the accepted demo dataset is 0, so this does not fire on day one; the
      # reconcile task clears the queue once the LLM is healthy again, so a short-lived outage is
      # absorbed by the 15m window instead of paging anyone.
      - uid: nexus-safety-pending-backlog
        title: "Posts have been sitting in the safety audit queue for 15m"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: nexus-prometheus
            model:
              refId: A
              # Same rollout guard and the same single-series reason as nexus-agent-pool-rejected.
              expr: 'max(max_over_time(safety_pending_posts{application="nexus-vibe"}[15m])) or max(up{job="nexus-vibe"} * 0)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0] }
        for: 1m
        # Refreshed by the reconcile task before its own health gate, so it reads 0 rather than
        # nothing while the LLM is down -- which is the one moment this backlog can be growing.
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: warning
          service: nexus-vibe
        annotations:
          summary: "Moderation is holding posts it has not cleared; they are invisible until it does."
          description: "Check the breaker gauge first: a held queue with a closed breaker means the checks ran and could not conclude. Compare against [AI-RECONCILE] Re-running safety check lines to see whether reconciliation is draining it."

      # Alerts that fire and go nowhere are worse than no alerts, because they read as coverage.
      # This watches Grafana's own alertmanager for alerts it accepted but has not handed to the
      # bridge -- a broken contact point, a bridge that stopped accepting, a routing policy that
      # stopped matching. Every other rule in this file would still look perfectly healthy while
      # this one is the only honest signal in the stack.
      #
      # What it cannot do is report its own evaluator's death: a Grafana process that is gone
      # evaluates nothing, including this. That gap is real, it is structural rather than a bug,
      # and it is named in docs/tickets/next-cycle-backlog.md rather than papered over here. The
      # scrape target in prometheus.yml exists so that "Grafana alive but not delivering" and
      # "Grafana alive but not scraped" are at least distinguishable from each other.
      - uid: nexus-alert-delivery-unprocessed
        title: "Grafana is holding alerts it has not delivered"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: nexus-prometheus
            model:
              refId: A
              # job="grafana" is the selector that keeps a second Grafana elsewhere on the same
              # Prometheus from answering for this one -- the same reason every other expression
              # names application="nexus-vibe".
              expr: 'max(grafana_alerting_alertmanager_alerts{job="grafana", state="unprocessed"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0] }
        for: 2m
        # Grafana exports this per scrape while it is up. Its absence means the grafana job is gone
        # from prometheus.yml, which is the same blindness this rule exists to name.
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: critical
          service: nexus-vibe
        annotations:
          summary: "Alerts are firing and not reaching anyone."
          description: "docker compose logs alert-bridge -- a stopped bridge, a refused webhook or an unmatched routing policy all look identical from here. The other rules may well be healthy and undelivered."
