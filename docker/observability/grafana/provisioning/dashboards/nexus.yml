apiVersion: 1

providers:
  - name: nexus-vibe
    folder: Nexus Vibe
    type: file
    # Dashboards are versioned in git; editing them in the UI would drift from the repo.
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
